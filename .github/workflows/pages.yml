name: Publicar Fortune's Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Preparar web compilada
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
